<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <style>
      .code { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #222; }
      .cmt { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #6a8a6a; }
      .err { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #c03030; font-weight: bold; }
      .ln { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #aaa; text-anchor: end; }
      .lane { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #333; text-anchor: middle; }
      .shared { fill: #7cc47c; stroke: #3d8a3d; }
      .excl { fill: #f2a65a; stroke: #b86b1c; }
      .note { font-size: 12.5px; fill: #444; }
      .hdr { font-size: 15px; font-weight: bold; fill: #333; }
    </style>
  </defs>
  <rect width="760" height="362" fill="#ffffff"/>

  <text x="20" y="26" class="hdr">A borrow lives from creation to its last use ("non-lexical lifetimes")</text>

  <!-- error row highlight -->
  <rect x="10" y="230" width="740" height="28" fill="#fde8e8"/>

  <!-- lane headers -->
  <text x="560" y="56" class="lane">first: &amp;v</text>
  <text x="640" y="56" class="lane">&amp;mut v</text>
  <text x="720" y="56" class="lane">last: &amp;v</text>
  <line x1="560" y1="64" x2="560" y2="294" stroke="#eee"/>
  <line x1="640" y1="64" x2="640" y2="294" stroke="#eee"/>
  <line x1="720" y1="64" x2="720" y2="294" stroke="#eee"/>

  <!-- code: row centers at 84 + 32*i -->
  <text x="34" y="88" class="ln">1</text><text x="44" y="88" class="code">let mut v = vec![1, 2, 3];</text>
  <text x="34" y="120" class="ln">2</text><text x="44" y="120" class="code">let first = &amp;v[0];</text><text x="290" y="120" class="cmt">// shared borrow</text>
  <text x="34" y="152" class="ln">3</text><text x="44" y="152" class="code">println!("{first}");</text><text x="290" y="152" class="cmt">// last use of first</text>
  <text x="34" y="184" class="ln">4</text><text x="44" y="184" class="code">v.push(4);</text><text x="290" y="184" class="cmt">// OK: first is dead</text>
  <text x="34" y="216" class="ln">5</text><text x="44" y="216" class="code">let last = &amp;v[3];</text>
  <text x="34" y="248" class="ln">6</text><text x="44" y="248" class="code">v.push(5);</text><text x="290" y="248" class="err">// error[E0502]</text>
  <text x="34" y="280" class="ln">7</text><text x="44" y="280" class="code">println!("{last}");</text><text x="290" y="280" class="cmt">// keeps last alive</text>

  <!-- bars -->
  <rect x="551" y="106" width="18" height="52" rx="4" class="shared"/>
  <rect x="631" y="170" width="18" height="20" rx="4" class="excl"/>
  <rect x="711" y="202" width="18" height="84" rx="4" class="shared"/>
  <rect x="631" y="234" width="18" height="20" rx="4" class="excl" stroke="#c03030" stroke-width="2"/>
  <text x="668" y="250" class="err" font-size="16" text-anchor="middle">✗</text>

  <!-- legend -->
  <rect x="20" y="312" width="16" height="14" class="shared"/>
  <text x="44" y="324" class="note">&amp;T — shared borrow: any number may coexist; nobody may mutate through them</text>
  <rect x="20" y="334" width="16" height="14" class="excl"/>
  <text x="44" y="346" class="note">&amp;mut T — exclusive borrow: must not overlap any other live borrow of the same value</text>
</svg>
