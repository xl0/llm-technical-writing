<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">
  <rect width="1000" height="410" fill="#fbfaf7"/>
  <style>
    .t { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .h { font-size: 13.5px; font-weight: 600; fill: #22252a; }
    .code { font-size: 12.5px; fill: #22252a; }
    .fn { fill: #eef2fb; stroke: #2563eb; stroke-width: 1.4; }
    .fnlabel { font-size: 12px; fill: #1e40af; }
    .vt { fill: #fdf3e7; stroke: #d97706; stroke-width: 1.4; }
    .vtrow { stroke: #e8cfa8; stroke-width: 1; }
    .note { font-size: 11.5px; fill: #4b5563; }
    .tag { font-size: 10.5px; fill: #8a8a84; letter-spacing: .06em; }
    .arr { stroke: #22252a; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22252a"/>
    </marker>
  </defs>

  <!-- left -->
  <text class="h t" x="24" y="34">Generics: one copy per concrete type</text>
  <text class="code" x="24" y="62">fn total&lt;T: Area&gt;(xs: &amp;[T]) -&gt; f64</text>
  <text class="tag t" x="24" y="96">MONOMORPHIZED AT COMPILE TIME</text>

  <rect class="fn" x="24" y="112" width="196" height="46" rx="5"/>
  <text class="fnlabel" x="38" y="141">total::&lt;Circle&gt;</text>
  <rect class="fn" x="244" y="112" width="196" height="46" rx="5"/>
  <text class="fnlabel" x="258" y="141">total::&lt;Rect&gt;</text>

  <line class="arr" x1="60" y1="88" x2="60" y2="107" marker-end="url(#a2)"/>
  <line class="arr" x1="342" y1="88" x2="342" y2="107" marker-end="url(#a2)"/>

  <text class="note t" x="24" y="186">Each instantiation is ordinary machine code:</text>
  <text class="note t" x="24" y="204">the call to <tspan font-family="'JetBrains Mono',monospace">area</tspan> is direct, so it inlines</text>
  <text class="note t" x="24" y="222">and vectorizes. Cost: binary size grows</text>
  <text class="note t" x="24" y="240">with the number of types, and generics</text>
  <text class="note t" x="24" y="258">must be known before compiling.</text>
  <text class="note t" x="24" y="284" fill="#8a8a84">Like <tspan font-family="'JetBrains Mono',monospace">#define</tspan> + <tspan font-family="'JetBrains Mono',monospace">_Generic</tspan>, but type-checked.</text>

  <line x1="490" y1="20" x2="490" y2="330" stroke="#e3e1da" stroke-width="1"/>

  <!-- right -->
  <text class="h t" x="516" y="34">dyn: one copy, table lookup</text>
  <text class="code" x="516" y="62">fn total(xs: &amp;[Box&lt;dyn Area&gt;]) -&gt; f64</text>
  <text class="tag t" x="516" y="96">RESOLVED AT RUN TIME</text>

  <rect class="fn" x="516" y="112" width="150" height="46" rx="5"/>
  <text class="fnlabel" x="530" y="141">total</text>
  <line class="arr" x1="566" y1="88" x2="566" y2="107" marker-end="url(#a2)"/>

  <rect class="vt" x="716" y="96" width="248" height="176" rx="5"/>
  <text class="tag t" x="730" y="118">VTABLE FOR Circle</text>
  <line x1="716" y1="128" x2="964" y2="128" stroke="#d97706" stroke-width="1.2"/>
  <text class="code" x="730" y="148">drop</text>
  <text class="code" x="730" y="168">size</text>
  <text class="code" x="730" y="188">align</text>
  <text class="code" x="730" y="212" fill="#92400e">area</text>
  <line class="vtrow" x1="716" y1="158" x2="964" y2="158"/>
  <line class="vtrow" x1="716" y1="178" x2="964" y2="178"/>
  <line class="vtrow" x1="716" y1="198" x2="964" y2="198"/>
  <text class="note t" x="800" y="148">frees the box</text>
  <text class="note t" x="800" y="168">bytes</text>
  <text class="note t" x="800" y="188">bytes</text>
  <text class="note t" x="800" y="212">indirect call</text>

  <line class="arr" x1="666" y1="135" x2="710" y2="135" marker-end="url(#a2)"/>
  <text class="note t" x="626" y="126" font-size="10.5">vtable</text>

  <text class="note t" x="516" y="298">One <tspan font-family="'JetBrains Mono',monospace">total</tspan> for all shapes, so the code</text>
  <text class="note t" x="516" y="316">stays small; each <tspan font-family="'JetBrains Mono',monospace">area()</tspan> call costs</text>
  <text class="note t" x="516" y="334">one load and usually blocks inlining.</text>
  <text class="note t" x="516" y="356" fill="#8a8a84">Like a hand-built struct of function</text>
  <text class="note t" x="516" y="374" fill="#8a8a84">pointers, or a C++ virtual call.</text>

  <text class="note t" x="24" y="400" fill="#8a8a84">Rule of thumb: <tspan font-family="'JetBrains Mono',monospace">impl Trait</tspan>/generics in library hot paths, <tspan font-family="'JetBrains Mono',monospace">dyn</tspan> at boundaries where you need a heterogeneous collection.</text>
</svg>
