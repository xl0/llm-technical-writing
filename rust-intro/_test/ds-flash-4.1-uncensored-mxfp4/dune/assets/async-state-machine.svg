<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="980" height="470" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="36" font-size="18" font-weight="700" fill="#0f172a">How Rust Compiles async/await: Stackless State-Machine Enums (Zero Heap Promises)</text>
  <text x="28" y="57" font-size="13" fill="#475569">Unlike JS Promises (eager, heap-allocated), a Rust Future is a lazy, compiler-generated C-style state machine driven by poll().</text>

  <!-- ================= LEFT: What You Write ================= -->
  <rect x="24" y="76" width="380" height="260" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="24" y="76" width="380" height="32" rx="8" fill="#e2e8f0"/>
  <rect x="24" y="96" width="380" height="12" fill="#e2e8f0"/>
  <text x="40" y="97" font-size="13" font-weight="700" fill="#1e293b">1. WHAT YOU WRITE (ASYNC FN)</text>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" transform="translate(38, 128)">
    <text x="0" y="0" fill="#1e40af" font-weight="700">async fn fetch_len(url: &amp;str) -&gt; usize {</text>
    <text x="14" y="26" fill="#475569">// --- State 0: before first .await ---</text>
    <text x="14" y="46" fill="#0f172a">let sock = <tspan fill="#0f766e" font-weight="700">connect(url).await</tspan>;</text>
    <text x="14" y="76" fill="#475569">// --- State 1: sock lives across .await ---</text>
    <text x="14" y="96" fill="#0f172a">let body = <tspan fill="#b45309" font-weight="700">sock.read_all().await</tspan>;</text>
    <text x="14" y="126" fill="#475569">// --- State 2: Ready(usize) ---</text>
    <text x="14" y="146" fill="#0f172a">body.len()</text>
    <text x="0" y="168" fill="#1e40af" font-weight="700">}</text>
  </g>

  <!-- Arrow Left -> Right -->
  <path d="M 406 206 L 456 206" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="431" y="186" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">desugars</text>
  <text x="431" y="198" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">at compile</text>
  <text x="431" y="222" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">time</text>

  <!-- ================= RIGHT: Compiler-Generated Enum ================= -->
  <rect x="464" y="76" width="492" height="260" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="464" y="76" width="492" height="32" rx="8" fill="#e2e8f0"/>
  <rect x="464" y="96" width="492" height="12" fill="#e2e8f0"/>
  <text x="480" y="97" font-size="13" font-weight="700" fill="#1e293b">2. WHAT RUSTC GENERATES (FLAT INLINE ENUM)</text>

  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" transform="translate(480, 126)">
    <text x="0" y="0" fill="#6b21a8" font-weight="700">enum FetchLenFuture&lt;'a&gt; {</text>

    <rect x="12" y="10" width="450" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="20" y="31" fill="#1e3a8a"><tspan font-weight="700">Unpolled</tspan> { url: &amp;'a str },</text>

    <rect x="12" y="50" width="450" height="34" rx="4" fill="#f0fdfa" stroke="#5eead4" stroke-width="1"/>
    <text x="20" y="71" fill="#115e59"><tspan font-weight="700">WaitingConnect</tspan> { fut: ConnectFuture&lt;'a&gt; },</text>

    <rect x="12" y="90" width="450" height="34" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="20" y="111" fill="#92400e"><tspan font-weight="700">WaitingRead</tspan> { sock: Socket, fut: ReadFuture },</text>

    <rect x="12" y="130" width="450" height="30" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="150" fill="#475569"><tspan font-weight="700">Done</tspan>, // panicked if polled again</text>

    <text x="0" y="178" fill="#6b21a8" font-weight="700">}</text>
    <text x="22" y="178" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Implements <tspan font-family="'JetBrains Mono', Consolas, monospace" font-weight="600">Future&lt;Output = usize&gt;</tspan> via <tspan font-family="'JetBrains Mono', Consolas, monospace" font-weight="600">poll(Pin&lt;&amp;mut Self&gt;, cx)</tspan></text>
  </g>

  <!-- ================= BOTTOM: Execution & Pinning Comparison ================= -->
  <rect x="24" y="352" width="932" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <g transform="translate(40, 375)">
    <text x="0" y="0" font-size="12.5" font-weight="700" fill="#0f172a">3 Key Takeaways for TypeScript, Python &amp; C Programmers:</text>
    <text x="0" y="22" font-size="11.5" fill="#334155">• <tspan font-weight="700" fill="#0f766e">Cold / Lazy by default:</tspan> Calling <tspan font-family="'JetBrains Mono', Consolas, monospace">fetch_len("...")</tspan> only constructs <tspan font-family="'JetBrains Mono', Consolas, monospace">FetchLenFuture::Unpolled</tspan>. Nothing runs until <tspan font-family="'JetBrains Mono', Consolas, monospace">.await</tspan> or <tspan font-family="'JetBrains Mono', Consolas, monospace">tokio::spawn</tspan>.</text>
    <text x="0" y="42" font-size="11.5" fill="#334155">• <tspan font-weight="700" fill="#1d4ed8">Free cancellation:</tspan> Dropping a Future at any <tspan font-family="'JetBrains Mono', Consolas, monospace">.await</tspan> point simply stops polling it and runs <tspan font-family="'JetBrains Mono', Consolas, monospace">Drop</tspan> on the active variant's fields (<tspan font-family="'JetBrains Mono', Consolas, monospace">sock</tspan>).</text>
    <text x="0" y="62" font-size="11.5" fill="#334155">• <tspan font-weight="700" fill="#92400e">Why Pin&lt;&amp;mut Self&gt; exists:</tspan> If <tspan font-family="'JetBrains Mono', Consolas, monospace">ReadFuture</tspan> holds a pointer to sibling field <tspan font-family="'JetBrains Mono', Consolas, monospace">sock</tspan>, <tspan font-family="'JetBrains Mono', Consolas, monospace">Pin</tspan> forbids moving the enum in memory once polling starts.</text>
  </g>
</svg>
