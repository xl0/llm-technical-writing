<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="30" y="30" font-weight="600" fill="#0f172a">One value, over time: any number of &amp;T, <tspan font-style="italic">or</tspan> exactly one &amp;mut T</text>

  <!-- Code column -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#0f172a">
    <text x="30" y="70">let mut v = vec![1, 2, 3];</text>
    <text x="30" y="100">let a = &amp;v;</text>
    <text x="30" y="130">let b = &amp;v;</text>
    <text x="30" y="160">println!("{a:?} {b:?}");</text>
    <text x="30" y="190">let m = &amp;mut v;</text>
    <text x="30" y="220">m.push(4);</text>
    <text x="30" y="250">println!("{v:?}");</text>
    <text x="30" y="280" fill="#b91c1c">println!("{a:?}");</text>
  </g>
  <text x="30" y="302" font-size="12" fill="#b91c1c">↑ if added: E0502, `a` would overlap `m`</text>

  <!-- Timeline column -->
  <line x1="330" y1="50" x2="330" y2="300" stroke="#cbd5e1"/>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="420" y="52">shared borrows</text>
    <text x="590" y="52">exclusive borrow</text>
  </g>

  <!-- owner bar -->
  <rect x="340" y="58" width="400" height="14" rx="3" fill="#e2e8f0"/>
  <text x="742" y="69" font-size="11" fill="#475569" text-anchor="end"></text>
  <text x="540" y="69" font-size="11" fill="#475569" text-anchor="middle">v owns the Vec for the whole scope</text>

  <!-- a: shared, lines 100..160 -->
  <rect x="360" y="90" width="24" height="80" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="372" y="112" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1e3a8a">a</text>
  <!-- b: shared, lines 130..160 -->
  <rect x="400" y="120" width="24" height="50" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="412" y="142" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#1e3a8a">b</text>
  <text x="440" y="142" font-size="12" fill="#1e40af">✓ overlapping &amp;T is fine</text>
  <text x="440" y="166" font-size="11" fill="#64748b">last use ends the borrow (NLL)</text>

  <!-- m: exclusive, lines 190..220 -->
  <rect x="520" y="180" width="24" height="50" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="532" y="202" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#991b1b">m</text>
  <text x="556" y="202" font-size="12" fill="#991b1b">✓ no &amp;T alive → &amp;mut allowed</text>
  <text x="556" y="220" font-size="11" fill="#64748b">may reallocate the buffer safely:</text>
  <text x="556" y="234" font-size="11" fill="#64748b">nobody else holds a pointer in</text>

  <!-- direct use of v -->
  <text x="440" y="252" font-size="12" fill="#1e40af">✓ m is dead, owner reads directly</text>

  <!-- conflict -->
  <rect x="360" y="180" width="24" height="100" rx="4" fill="none" stroke="#ef4444" stroke-dasharray="4 3"/>
  <line x1="364" y1="184" x2="380" y2="276" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="380" y1="184" x2="364" y2="276" stroke="#ef4444" stroke-width="1.5"/>
  <text x="440" y="284" font-size="12" fill="#b91c1c">✗ a shared and an exclusive borrow of v alive at once</text>

  <text x="30" y="322" font-size="11" fill="#64748b">Checked entirely at compile time. At runtime, &amp;T and &amp;mut T are plain pointers.</text>
</svg>
