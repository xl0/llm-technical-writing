<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550" width="980" height="550" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="980" height="550" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="36" font-size="18" font-weight="700" fill="#0f172a">Physical Memory Layout: Stack Headers, Fat Pointers &amp; Niche Optimization (64-bit)</text>
  <text x="28" y="57" font-size="13" fill="#475569">Unlike Python/JS (everything boxed on the heap), Rust values are flat C-like structs on the stack by default.</text>

  <!-- ================= TOP SECTION: String vs &str vs &[u8] ================= -->
  <!-- Stack Frame Box -->
  <rect x="24" y="76" width="445" height="272" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="24" y="76" width="445" height="32" rx="8" fill="#e2e8f0"/>
  <rect x="24" y="96" width="445" height="12" fill="#e2e8f0"/>
  <text x="40" y="97" font-size="13" font-weight="700" fill="#1e293b">STACK FRAME (64-bit words = 8 bytes each)</text>

  <!-- s: String -->
  <text x="40" y="128" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#1e40af">let mut s = String::from("rust!");</text>
  <text x="300" y="128" font-size="11.5" fill="#64748b">// 24B header (owns heap)</text>

  <!-- 3 fields of String -->
  <g transform="translate(40, 136)">
    <rect x="0" y="0" width="128" height="42" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="10" y="16" font-size="11" fill="#64748b">ptr: *mut u8 (8B)</text>
    <text x="10" y="34" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="600" fill="#1d4ed8">0x7f8a_1040</text>

    <rect x="128" y="0" width="128" height="42" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="138" y="16" font-size="11" fill="#64748b">len: usize (8B)</text>
    <text x="138" y="34" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#0f172a">5</text>

    <rect x="256" y="0" width="128" height="42" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="266" y="16" font-size="11" fill="#64748b">cap: usize (8B)</text>
    <text x="266" y="34" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#0f172a">8</text>
  </g>

  <!-- sub: &str -->
  <text x="40" y="208" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#0f766e">let sub: &amp;str = &amp;s[1..4];</text>
  <text x="245" y="208" font-size="11.5" fill="#64748b">// 16B fat pointer (borrows)</text>

  <g transform="translate(40, 216)">
    <rect x="0" y="0" width="128" height="42" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="10" y="16" font-size="11" fill="#64748b">ptr: *const u8 (8B)</text>
    <text x="10" y="34" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="600" fill="#0f766e">0x7f8a_1041</text>

    <rect x="128" y="0" width="128" height="42" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="138" y="16" font-size="11" fill="#64748b">len: usize (8B)</text>
    <text x="138" y="34" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#0f172a">3</text>
  </g>

  <!-- lit: &'static str -->
  <text x="40" y="288" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#b45309">let lit: &amp;'static str = "ok";</text>
  <text x="262" y="288" font-size="11.5" fill="#64748b">// 16B fat pointer (.rodata)</text>

  <g transform="translate(40, 296)">
    <rect x="0" y="0" width="128" height="32" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="10" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#b45309">ptr: 0x4002_a0</text>

    <rect x="128" y="0" width="128" height="32" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="138" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#0f172a">len: 2</text>
  </g>

  <!-- Heap & Static Memory Box -->
  <rect x="515" y="76" width="441" height="272" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="515" y="76" width="441" height="32" rx="8" fill="#e2e8f0"/>
  <rect x="515" y="96" width="441" height="12" fill="#e2e8f0"/>
  <text x="531" y="97" font-size="13" font-weight="700" fill="#1e293b">HEAP &amp; .RODATA (Contiguous UTF-8 Bytes, No Null Byte)</text>

  <!-- Heap Allocation for String -->
  <text x="535" y="128" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#475569">Heap @ 0x7f8a_1040 (owned by s, freed when s drops):</text>

  <!-- 8 byte cells on heap -->
  <g transform="translate(535, 145)">
    <!-- indices -->
    <text x="23" y="-4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">+0</text>
    <text x="71" y="-4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">+1</text>
    <text x="119" y="-4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">+2</text>
    <text x="167" y="-4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">+3</text>
    <text x="215" y="-4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">+4</text>
    <text x="263" y="-4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">+5</text>
    <text x="311" y="-4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">+6</text>
    <text x="359" y="-4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">+7</text>

    <!-- 5 initialized cells -->
    <rect x="0" y="2" width="46" height="42" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="23" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">'r'</text>

    <rect x="48" y="2" width="46" height="42" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="71" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#115e59" text-anchor="middle">'u'</text>

    <rect x="96" y="2" width="46" height="42" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="119" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#115e59" text-anchor="middle">'s'</text>

    <rect x="144" y="2" width="46" height="42" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="167" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#115e59" text-anchor="middle">'t'</text>

    <rect x="192" y="2" width="46" height="42" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="215" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">'!'</text>

    <!-- 3 uninitialized spare capacity cells -->
    <rect x="240" y="2" width="46" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="263" y="27" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">uninit</text>

    <rect x="288" y="2" width="46" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="311" y="27" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">uninit</text>

    <rect x="336" y="2" width="46" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="359" y="27" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">uninit</text>

    <!-- Brackets for sub, len, cap -->
    <path d="M 48 52 L 48 59 L 190 59 L 190 52" fill="none" stroke="#0d9488" stroke-width="1.5"/>
    <text x="119" y="73" font-size="11.5" font-weight="600" fill="#0f766e" text-anchor="middle">sub: &amp;s[1..4] (len = 3)</text>

    <path d="M 0 80 L 0 87 L 238 87 L 238 80" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <text x="119" y="100" font-size="11.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">initialized len = 5</text>

    <path d="M 0 107 L 0 114 L 382 114 L 382 107" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="191" y="127" font-size="11.5" fill="#475569" text-anchor="middle">allocated capacity = 8</text>
  </g>

  <!-- Static .rodata -->
  <text x="535" y="288" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#475569">ELF/Mach-O .rodata @ 0x4002_a0 (baked into binary):</text>
  <g transform="translate(535, 296)">
    <rect x="0" y="0" width="46" height="32" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="23" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">'o'</text>
    <rect x="48" y="0" width="46" height="32" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="71" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">'k'</text>
  </g>

  <!-- Cleanly routed arrows from bottom of ptr boxes (zero overlap with len/cap!) -->
  <circle cx="104" cy="178" r="3" fill="#2563eb"/>
  <path d="M 104 178 L 104 188 L 488 188 L 488 168 L 531 168" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>

  <circle cx="104" cy="258" r="3" fill="#0d9488"/>
  <path d="M 104 258 L 104 268 L 502 268 L 502 198 L 579 198" fill="none" stroke="#0d9488" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>

  <circle cx="104" cy="328" r="3" fill="#d97706"/>
  <path d="M 104 328 L 104 338 L 495 338 L 495 312 L 531 312" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>

  <!-- ================= BOTTOM SECTION: Enums & Niche Optimization ================= -->
  <rect x="24" y="364" width="932" height="164" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="24" y="364" width="932" height="32" rx="8" fill="#e2e8f0"/>
  <rect x="24" y="384" width="932" height="12" fill="#e2e8f0"/>
  <text x="40" y="385" font-size="13" font-weight="700" fill="#1e293b">INLINE TAGGED UNIONS (ENUMS) &amp; NICHE OPTIMIZATION (Zero-Space Option&lt;&amp;T&gt;)</text>

  <!-- Left: General Enum -->
  <g transform="translate(40, 412)">
    <text x="0" y="12" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#0f172a">enum Packet { Ping, Key(u64), Pos(i32, i32) }</text>
    <text x="0" y="30" font-size="12" fill="#475569">Inline like C <tspan font-family="'JetBrains Mono', Consolas, monospace">struct { uint8_t tag; union { ... }; }</tspan> (16B):</text>

    <rect x="0" y="42" width="76" height="44" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="38" y="60" font-size="11" font-weight="600" fill="#6b21a8" text-anchor="middle">tag (1B)</text>
    <text x="38" y="77" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#581c87" text-anchor="middle">0 / 1 / 2</text>

    <rect x="76" y="42" width="124" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="138" y="60" font-size="11" fill="#64748b" text-anchor="middle">padding (7B)</text>
    <text x="138" y="77" font-size="10.5" fill="#94a3b8" text-anchor="middle">8-byte align</text>

    <rect x="200" y="42" width="215" height="44" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="307" y="60" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">payload union (8B)</text>
    <text x="307" y="77" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#1d4ed8" text-anchor="middle">u64  OR  (i32, i32)</text>
  </g>

  <!-- Divider -->
  <line x1="480" y1="406" x2="480" y2="516" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Right: Niche Optimization -->
  <g transform="translate(502, 412)">
    <text x="0" y="12" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#047857">size_of::&lt;Option&lt;&amp;T&gt;&gt;() == 8 bytes  (No tag byte!)</text>
    <text x="0" y="30" font-size="12" fill="#475569">Since <tspan font-family="'JetBrains Mono', Consolas, monospace">&amp;T</tspan> is never null, <tspan font-family="'JetBrains Mono', Consolas, monospace">0x0</tspan> is a "niche" bit-pattern reused for <tspan font-family="'JetBrains Mono', Consolas, monospace">None</tspan>:</text>

    <rect x="0" y="42" width="205" height="44" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="102" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Some(&amp;val) (8B)</text>
    <text x="102" y="77" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#047857" text-anchor="middle">0x7ffc_89a0 (non-zero)</text>

    <rect x="220" y="42" width="205" height="44" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="322" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">None (8B)</text>
    <text x="322" y="77" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#b91c1c" text-anchor="middle">0x0000_0000 (null bits)</text>
  </g>
</svg>
