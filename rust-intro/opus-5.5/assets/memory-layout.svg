<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .code { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #222; }
      .cell { fill: #eef3fb; stroke: #4a6fa5; stroke-width: 1.2; }
      .heap { fill: #fff6e5; stroke: #c98a1b; stroke-width: 1.2; }
      .view { fill: #ffe0b8; stroke: #c98a1b; stroke-width: 1.2; }
      .borrow { fill: #ffe0b8; stroke: #c98a1b; stroke-width: 1.2; }
      .unused { fill: #f2f2f2; stroke: #c98a1b; stroke-width: 1.2; stroke-dasharray: 3 3; }
      .ct { font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #222; text-anchor: middle; }
      .hdr { font-size: 15px; font-weight: bold; fill: #333; text-anchor: middle; }
      .note { font-size: 12.5px; fill: #444; }
      .link { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>

  <text x="170" y="26" class="hdr">Stack (fixed size, known at compile time)</text>
  <text x="600" y="26" class="hdr">Heap</text>
  <line x1="400" y1="40" x2="400" y2="384" stroke="#bbb" stroke-dasharray="4 4"/>

  <!-- String -->
  <text x="30" y="58" class="code">let s = String::from("hello");</text>
  <rect x="40" y="66" width="80" height="32" class="cell"/><text x="80" y="87" class="ct">len = 5</text>
  <rect x="120" y="66" width="80" height="32" class="cell"/><text x="160" y="87" class="ct">cap = 5</text>
  <rect x="200" y="66" width="70" height="32" class="cell"/><text x="222" y="87" class="ct">ptr</text><circle cx="252" cy="82" r="3.5" fill="#333"/>
  <rect x="460" y="66" width="34" height="32" class="heap"/><text x="477" y="87" class="ct">h</text>
  <rect x="494" y="66" width="34" height="32" class="view"/><text x="511" y="87" class="ct">e</text>
  <rect x="528" y="66" width="34" height="32" class="view"/><text x="545" y="87" class="ct">l</text>
  <rect x="562" y="66" width="34" height="32" class="view"/><text x="579" y="87" class="ct">l</text>
  <rect x="596" y="66" width="34" height="32" class="heap"/><text x="613" y="87" class="ct">o</text>
  <text x="640" y="87" class="note">(no NUL)</text>
  <path d="M252,82 L456,82" class="link"/>

  <!-- &str -->
  <text x="30" y="142" class="code">let t: &amp;str = &amp;s[1..4];</text>
  <rect x="40" y="150" width="80" height="32" class="borrow"/><text x="80" y="171" class="ct">len = 3</text>
  <rect x="120" y="150" width="70" height="32" class="borrow"/><text x="142" y="171" class="ct">ptr</text><circle cx="172" cy="166" r="3.5" fill="#333"/>
  <text x="40" y="200" class="note">"fat pointer" (ptr + len): owns nothing</text>
  <path d="M172,166 C 380,166 511,150 511,102" class="link"/>

  <!-- Vec -->
  <text x="30" y="234" class="code">let v: Vec&lt;i32&gt; = vec![1, 2, 3];</text>
  <rect x="40" y="242" width="80" height="32" class="cell"/><text x="80" y="263" class="ct">len = 3</text>
  <rect x="120" y="242" width="80" height="32" class="cell"/><text x="160" y="263" class="ct">cap = 4</text>
  <rect x="200" y="242" width="70" height="32" class="cell"/><text x="222" y="263" class="ct">ptr</text><circle cx="252" cy="258" r="3.5" fill="#333"/>
  <rect x="460" y="242" width="44" height="32" class="heap"/><text x="482" y="263" class="ct">1</text>
  <rect x="504" y="242" width="44" height="32" class="heap"/><text x="526" y="263" class="ct">2</text>
  <rect x="548" y="242" width="44" height="32" class="heap"/><text x="570" y="263" class="ct">3</text>
  <rect x="592" y="242" width="44" height="32" class="unused"/><text x="614" y="263" class="ct" fill="#999">?</text>
  <text x="646" y="263" class="note">spare capacity</text>
  <path d="M252,258 L456,258" class="link"/>

  <!-- Box -->
  <text x="30" y="314" class="code">let b = Box::new(Point { x: 1.0, y: 2.0 });</text>
  <rect x="40" y="322" width="70" height="32" class="cell"/><text x="62" y="343" class="ct">ptr</text><circle cx="92" cy="338" r="3.5" fill="#333"/>
  <text x="40" y="372" class="note">one word, never null</text>
  <rect x="460" y="322" width="80" height="32" class="heap"/><text x="500" y="343" class="ct">x: 1.0</text>
  <rect x="540" y="322" width="80" height="32" class="heap"/><text x="580" y="343" class="ct">y: 2.0</text>
  <path d="M92,338 L456,338" class="link"/>

  <!-- legend -->
  <rect x="30" y="396" width="16" height="14" class="cell"/>
  <text x="54" y="408" class="note">owner: frees its heap buffer when it goes out of scope (Drop)</text>
  <rect x="30" y="418" width="16" height="14" class="borrow"/>
  <text x="54" y="430" class="note">borrow: a view into someone else's memory; frees nothing, can't outlive the owner</text>
</svg>
